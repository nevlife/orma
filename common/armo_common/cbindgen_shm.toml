language = "C"
include_guard = "ARMO_PRELOAD_ARMO_SHM_H"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
documentation_style = "c99"
header = "/* Generated by cbindgen from armo_common/src/shm.rs; regenerate with scripts/gen_headers.sh. */"
# cbindgen writes the trailer after its include guard.
trailer = """
#ifndef ARMO_PRELOAD_ARMO_SHM_TRAILER
#define ARMO_PRELOAD_ARMO_SHM_TRAILER

static inline size_t armo_ring_offset(uint32_t table_entries)
{
  size_t end = sizeof(armo_thread_slot) + (size_t)table_entries * sizeof(armo_table_entry);
  return (end + ARMO_CACHE_LINE - 1) / ARMO_CACHE_LINE * ARMO_CACHE_LINE;
}

static inline size_t armo_thread_size(uint32_t table_entries, uint32_t ring_bytes)
{
  return armo_ring_offset(table_entries) + ring_bytes;
}

_Static_assert(sizeof(armo_shm_header) == ARMO_SHM_HEADER_SIZE, "armo_shm_header");
_Static_assert(sizeof(armo_thread_slot) == 3 * ARMO_CACHE_LINE, "armo_thread_slot");
_Static_assert(sizeof(armo_table_entry) == 360, "armo_table_entry");

#endif  /* ARMO_PRELOAD_ARMO_SHM_TRAILER */"""
