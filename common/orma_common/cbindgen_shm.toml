language = "C"
include_guard = "ORMA_PRELOAD_ORMA_SHM_H"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
documentation_style = "c99"
header = "/* Generated by cbindgen from orma_common/src/shm.rs; regenerate with scripts/gen_headers.sh. */"
# cbindgen writes the trailer after its include guard.
trailer = """
#ifndef ORMA_PRELOAD_ORMA_SHM_TRAILER
#define ORMA_PRELOAD_ORMA_SHM_TRAILER

static inline size_t orma_ring_offset(uint32_t table_entries)
{
  size_t end = sizeof(orma_thread_slot) + (size_t)table_entries * sizeof(orma_table_entry);
  return (end + ORMA_CACHE_LINE - 1) / ORMA_CACHE_LINE * ORMA_CACHE_LINE;
}

static inline size_t orma_thread_size(uint32_t table_entries, uint32_t ring_bytes)
{
  return orma_ring_offset(table_entries) + ring_bytes;
}

_Static_assert(sizeof(orma_shm_header) == ORMA_SHM_HEADER_SIZE, "orma_shm_header");
_Static_assert(sizeof(orma_thread_slot) == 3 * ORMA_CACHE_LINE, "orma_thread_slot");
_Static_assert(sizeof(orma_table_entry) == 360, "orma_table_entry");

#endif  /* ORMA_PRELOAD_ORMA_SHM_TRAILER */"""
