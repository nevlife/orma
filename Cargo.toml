[workspace]
resolver = "3"
# Every crate of the design (17), listed once here; a work package then edits only its own.
members = [
    "common/orma_common",
    "common/orma_proto",
    "collect/orma_ebpf",
    "daemon/orma_daemon",
    "daemon/orma_collectd",
]
# orma_ebpf builds only for the BPF target, through orma_daemon's build script.
default-members = [
    "common/orma_common",
    "common/orma_proto",
    "daemon/orma_daemon",
    "daemon/orma_collectd",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
orma-common = { path = "common/orma_common", default-features = false }
orma-proto = { path = "common/orma_proto" }
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
aya-ebpf = { version = "0.2.1", default-features = false }
cbindgen = { version = "0.29.4", default-features = false }
libc = { version = "0.2", default-features = false }
object = { version = "0.39.1", default-features = false, features = ["elf", "read_core", "std"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# orma_ebpf cannot take `unsafe_code = "deny"` and lists the unsafe lints itself.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

# pedantic, less the lints written for published library APIs, and the numeric casts of wire and
# statistics code, whose ranges the protocol and the tests fix.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"
default_trait_access = "allow"
format_collect = "allow"
format_push_string = "allow"
unreadable_literal = "allow"
float_cmp = "allow"
case_sensitive_file_extension_comparisons = "allow"
decimal_bitwise_operands = "allow"
implicit_hasher = "allow"
items_after_statements = "allow"
large_stack_arrays = "allow"
manual_let_else = "allow"
match_same_arms = "allow"
needless_continue = "allow"
unnecessary_wraps = "allow"
used_underscore_binding = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

[profile.release.package.orma-ebpf]
debug = 2
codegen-units = 1
