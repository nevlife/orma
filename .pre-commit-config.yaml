# orma pre-commit. Enable: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.6
    hooks:
      - id: clang-format
        types_or: [c, c++]
        files: ^collect/orma_(preload|lttng|span)/
        # Generated: orma_common's header test compares them byte for byte with cbindgen's output.
        exclude: ^collect/orma_preload/include/orma_preload/orma_(shm|events)\.h$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
        types: [python]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.yaml, --fix]

  - repo: local
    hooks:
      # All three check the whole workspace; clippy also builds the eBPF crate through build.rs.
      - id: rustfmt
        name: rustfmt
        entry: scripts/cargo.sh fmt --all --check
        language: script
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: clippy (ormad, orma-common)
        entry: scripts/cargo.sh clippy --release --all-targets --locked -- -D warnings
        language: script
        types_or: [rust, toml]
        pass_filenames: false

      - id: clippy-ebpf
        name: clippy (orma-ebpf, pinned nightly)
        entry: scripts/clippy_ebpf.sh
        language: script
        files: ^(collect/orma_ebpf|common/orma_common)/
        pass_filenames: false

      # Only when the lock file changes: each run fetches the RustSec advisory database.
      - id: cargo-audit
        name: cargo audit (Cargo.lock against RustSec)
        entry: scripts/cargo.sh audit --deny warnings
        language: script
        files: ^Cargo\.lock$
        pass_filenames: false

      - id: flake8
        name: python defect classes (setup.cfg [flake8])
        entry: python3 -m flake8
        language: system
        types: [python]

      # Needs the build's compile commands (scripts/check_clang_tidy.py says where it looks).
      - id: clang-tidy
        name: clang-tidy defect classes (.clang-tidy)
        entry: scripts/check_clang_tidy.py
        language: python
        additional_dependencies: [clang-tidy==22.1.8]
        types_or: [c, c++]
        files: ^collect/orma_(preload|lttng|span)/
        # One run: a changed header checks every translation unit, so parallel batches multiply.
        require_serial: true
