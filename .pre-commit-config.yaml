# armo pre-commit. Enable: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.6
    hooks:
      - id: clang-format
        types_or: [c, c++]
        files: ^armo_(preload|lttng)/
        # Generated: armo_common's header test compares them byte for byte with cbindgen's output.
        exclude: ^armo_preload/include/armo_preload/armo_(shm|events)\.h$

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
        types: [python]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [-c, .markdownlint.yaml, --fix]

  - repo: local
    hooks:
      - id: no-emoji
        name: no emoji
        entry: scripts/check_no_emoji.sh
        language: script
        types: [text]

      - id: hangul-md-only
        name: hangul only in .md files
        entry: scripts/check_hangul_md_only.sh
        language: script
        types: [text]

      # All three check the whole workspace; clippy also builds the eBPF crate through build.rs.
      - id: rustfmt
        name: rustfmt
        entry: scripts/cargo.sh fmt --all --check
        language: script
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: clippy (armod, armo-common)
        entry: scripts/cargo.sh clippy --release --all-targets --locked -- -D warnings
        language: script
        types_or: [rust, toml]
        pass_filenames: false

      - id: clippy-ebpf
        name: clippy (armo-ebpf, pinned nightly)
        entry: scripts/clippy_ebpf.sh
        language: script
        files: ^(armo_ebpf|armo_common)/
        pass_filenames: false

      # Only when the lock file changes: each run fetches the RustSec advisory database.
      - id: cargo-audit
        name: cargo audit (Cargo.lock against RustSec)
        entry: scripts/cargo.sh audit --deny warnings
        language: script
        files: ^Cargo\.lock$
        pass_filenames: false

      - id: flake8
        name: python defect classes (setup.cfg [flake8])
        entry: python3 -m flake8
        language: system
        types: [python]

      # Needs the build's compile commands (scripts/check_clang_tidy.py says where it looks).
      - id: clang-tidy
        name: clang-tidy defect classes (.clang-tidy)
        entry: scripts/check_clang_tidy.py
        language: python
        additional_dependencies: [clang-tidy==22.1.8]
        types_or: [c, c++]
        files: ^armo_(preload|lttng)/

      - id: docs-tracked
        name: no untracked files under docs/
        entry: scripts/check_docs_tracked.sh
        language: script
        pass_filenames: false
        always_run: true
